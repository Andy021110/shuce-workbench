# Include these locations inside the existing server block.
location = /shuce { return 301 /shuce/; }
location ^~ /shuce/ {
    alias /var/www/shuce/;
    index index.html;
    try_files $uri $uri/ /shuce/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache" always;
}
location = /shuce-api/api/auth/login {
    limit_req zone=shuce_login burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8020/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /shuce-api/api/query {
    default_type application/json;
    return 403 '{"detail":"在线体验请通过工作台提交异步分析任务"}';
}
location = /shuce-api/api/schema/index/rebuild {
    default_type application/json;
    return 403 '{"detail":"在线体验不开放全库索引重建"}';
}
location = /shuce-api/api/jobs {
    # Recovery list and submissions share this limit; per-job polling is unrestricted.
    limit_except GET POST { deny all; }
    limit_req zone=shuce_work burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8020/api/jobs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 210s;
}
location = /shuce-api/api/schema/search {
    limit_req zone=shuce_work burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8020/api/schema/search;
    proxy_set_header Host $host;
    proxy_read_timeout 210s;
}
location ^~ /shuce-api/ {
    proxy_pass http://127.0.0.1:8020/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 210s;
    add_header Cache-Control "no-store" always;
}
